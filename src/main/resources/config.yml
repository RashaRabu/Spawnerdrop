# ==========================================
#      Dropspawner Config - Rabusoore
# ==========================================

item-settings:
  item-settings:
  pickup-delay-ticks: 20
  owner-only-seconds: 10
  glow: true

  # Kustomisasi Nama Item Spawner (Format MiniMessage / Color Code)
  custom-name:
    enabled: true
    format: "<yellow><bold>{mob}</bold> Spawner</yellow>"

  # Kustomisasi Lore Item Spawner
  custom-lore:
    enabled: true
    lines:
      - "<gray>Spawner khusus tipe <white>{mob}</white></gray>"
      - "<dark_gray>Dapat ditaruh atau ditumpuk (SmartSpawner)</dark_gray>"

  sound:
    enabled: true
    type: ENTITY_ITEM_PICKUP
    volume: 1.0
    pitch: 1.2
  particle:
    enabled: true
    type: VILLAGER_HAPPY
    count: 15

blacklist:
  # Daftar mob yang tidak pernah menjatuhkan spawner
  mobs:
    - ENDER_DRAGON
    - WITHER
    - WARDEN
    - ELDER_GUARDIAN
    - GIANT
    - ILLUSIONER
  # Jenis spawner yang dilarang didapatkan (misal: dilarang mendapatkan spawner VILLAGER)
  drop-types: []
  # World tempat fitur drop dimatikan
  worlds: []
  # true = blacklist.worlds adalah world yang dilarang, false = whitelist.worlds (hanya world ini yang aktif)
  world-blacklist-mode: true

looting:
  # Aktifkan statistik bonus Looting enchantment
  enabled: true
  # Tambahan persentase per level Looting (contoh: level 3 = +1.5%)
  chance-per-level: 0.5
  # Batas maksimum chance akhir setelah dihitung Looting (persen)
  max-chance: 10.0

messages:
  prefix: "<gradient:#E76F51:#F4A261>[Dropspawner]</gradient> "
  spawner-dropped: "<green>Kamu berhasil membuat spawner <yellow>{mob}</yellow> terlepas!</green>"
  reload-success: "<green>Konfigurasi berhasil diperbarui dari disk!</green>"
  no-permission: "<red>Kamu tidak memiliki izin untuk menjalankan perintah ini.</red>"
  invalid-mob: "<red>Nama mob '{mob}' tidak valid atau tidak terdaftar.</red>"
  mob-updated: "<green>Pengaturan untuk mob <yellow>{mob}</yellow> berhasil disimpan.</green>"
  blacklist-updated: "<green>Daftar blacklist mob berhasil diperbarui!</green>"
  info-header: "<gold>=== Info Drop Spawner: <yellow>{mob}</yellow> ===</gold>"
  info-status: "<gray>Status Drop: <white>{status}</white></gray>"
  info-chance: "<gray>Peluang Dasar: <white>{chance}%</white></gray>"
  info-drop-type: "<gray>Tipe Spawner: <white>{type}</white></gray>"
